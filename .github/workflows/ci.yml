name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, main]
  workflow_call:

jobs:
  check:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:shared && npm run build:ui

      - name: Test admin
        run: npm run test --workspace=admin

      - name: Test client
        run: npm run test --workspace=client

  build:
    name: Build admin & client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:shared && npm run build:ui

      - name: Build admin (type and lint checks enabled)
        run: npm run build --workspace=admin

      - name: Build client (type checks run in the Type Check job; the build skips lint)
        run: npm run build --workspace=client

      - name: Build telegram mini-app
        run: npm run build --workspace=telegram-mini-app
